# =============================================================================
# GitHub Actions Workflow — Build & Verify Docker Images
# =============================================================================
# This workflow runs on every push and PR to ensure the Dockerfiles are valid.
# It also acts as a basic CI pipeline.
# =============================================================================

name: Docker Build & CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "deployment/**"
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GATEWAY: ${{ github.repository }}/gateway
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build the Gateway Docker image
  # ---------------------------------------------------------------
  build-gateway:
    name: Build Gateway Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway image (no push, just validation)
        uses: docker/build-push-action@v5
        with:
          context: gateway
          push: false
          tags: ${{ env.IMAGE_NAME_GATEWAY }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run a quick smoke test
        run: |
          docker run --rm -d --name gateway-test -p 8000:8000 \
            -e SUPABASE_URL=http://placeholder \
            -e SUPABASE_SERVICE_KEY=placeholder \
            ${{ env.IMAGE_NAME_GATEWAY }}:ci-${{ github.sha }}
          sleep 3
          curl -f http://localhost:8000/health || exit 1
          echo "Gateway health check PASSED"
          docker stop gateway-test

  # ---------------------------------------------------------------
  # Job 2: Build the Worker Docker image
  # ---------------------------------------------------------------
  build-worker:
    name: Build Worker Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker image (no push, just validation)
        uses: docker/build-push-action@v5
        with:
          context: worker
          push: false
          tags: ${{ env.IMAGE_NAME_WORKER }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify worker imports (quick syntax check)
        run: |
          docker run --rm --entrypoint python ${{ env.IMAGE_NAME_WORKER }}:ci-${{ github.sha }} \
            -c "import sys; sys.path.insert(0,'.'); \
                from worker import _load_model_pipeline, run_worker_loop; \
                print('Worker module imports OK')"

  # ---------------------------------------------------------------
  # Job 3: Lint check (optional)
  # ---------------------------------------------------------------
  lint:
    name: Python Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install flake8==7.1.1

      - name: Run flake8 on all Python files
        run: |
          flake8 \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --statistics \
            gateway/ worker/